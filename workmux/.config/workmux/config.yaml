nerdfont: true
# 会社の managed settings が defaultMode=default を強制するため、起動フラグで auto にする
agent: "env CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1 claude --permission-mode auto"
window_prefix: "wm-"
post_create:
  - direnv allow || true

panes:
  - command: <agent>
    focus: true
# ステータス表示: tmux.confで管理（アイコン後のスペース確保のため）
status_format: false

# ステータスアイコン（Nerd Font対応）
status_icons:
  working: "󰚩"   # 処理中
  waiting: "󰔟"   # 入力待ち
  done: "󰄬"      # 完了
